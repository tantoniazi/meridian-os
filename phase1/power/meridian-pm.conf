# Meridian OS - Power Management Configuration
# System-wide power management settings

# Sleep states
[Sleep]
# Allow suspend-to-idle (s2idle), shallow, deep, hibernate
AllowSuspend=yes
AllowHibernation=yes
AllowSuspendThenHibernate=yes
AllowHybridSleep=yes

# Default suspend mode
# Options: s2idle, shallow, deep
SuspendMode=s2idle

# Hibernate mode
# Options: platform, shutdown, reboot
HibernateMode=platform

# Hybrid sleep mode
HybridSleepMode=suspend

# SuspendThenHibernate delay (seconds)
SuspendThenHibernateDelay=300

# Lid switch behavior
[LidSwitch]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Power button behavior
[PowerButton]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff

# Suspend key behavior
[SuspendKey]
HandleSuspendKey=suspend
HandleSuspendKeyLongPress=hibernate

# Hibernate key behavior
[HibernateKey]
HandleHibernateKey=hibernate

# Idle actions
[Idle]
IdleAction=suspend
IdleActionSec=30min

# Critical power level
[CriticalPower]
HandleCriticalPowerAction=hybrid-sleep

# Power levels (percentage)
[PowerLevels]
Low=15%
Critical=5%

# CPU frequency scaling
[CPU]
Governor=ondemand
MinFreq=0
MaxFreq=0
EnergyPerformancePreference=balance_performance

# GPU
[GPU]
PowerSaving=yes
RuntimePM=yes

# Display
[Display]
DPMS=yes
BlankTime=5min
StandbyTime=10min
SuspendTime=20min
OffTime=30min

# Backlight
[Backlight]
Brightness=80%
DimTime=30sec
DimBrightness=30%

# USB
[USB]
Autosuspend=2
RuntimePM=yes

# PCI
[PCI]
RuntimePM=yes

# SATA
[SATA]
RuntimePM=yes
ALPM=yes

# Audio
[Audio]
PowerSave=1
RuntimePM=yes

# Network
[Network]
WakeOnLan=no
RuntimePM=yes

# Bluetooth
[Bluetooth]
RuntimePM=yes
AutoEnable=no

# WiFi
[WiFi]
PowerSave=yes
RuntimePM=yes

# Modem
[Modem]
RuntimePM=yes
AutoConnect=yes

# GPS
[GPS]
RuntimePM=yes
AutoEnable=no

# Sensors
[Sensors]
RuntimePM=yes
AutoEnable=yes

# Keyboard backlight
[KeyboardBacklight]
Brightness=50%
IdleTime=10sec
DimTime=5sec
DimBrightness=20%

# Keyboard
[Keyboard]
DimTime=30sec
DimBrightness=20%

# Touchpad
[Touchpad]
TapToClick=yes
NaturalScrolling=yes
RuntimePM=yes

# Haptic feedback
[Haptic]
Enabled=yes
Strength=50%

# Vibration
[Vibration]
Enabled=yes
Strength=50%

# LED
[LED]
Brightness=50%
Breathing=yes

# Battery
[Battery]
ChargeThresholdStart=80%
ChargeThresholdStop=90%
DischargeThreshold=20%
HealthCheck=yes

# Thermal
[Thermal]
TripPoints=45,55,65,75,85,95
CoolingPolicy=active

# CPU thermal
[CPUThermal]
TripPoints=50,60,70,80,90,100
CoolingPolicy=active

# GPU thermal
[GPUThermal]
TripPoints=50,60,70,80,90,100
CoolingPolicy=active

# Battery thermal
[BatteryThermal]
TripPoints=40,45,50,55
CoolingPolicy=active

# Ambient thermal
[AmbientThermal]
TripPoints=35,40,45,50
CoolingPolicy=passive

# Platform thermal
[PlatformThermal]
TripPoints=50,60,70,80,90
CoolingPolicy=active

# Power profiles
[Profile:performance]
CPU_Governor=performance
GPU_PowerSaving=no
Display_Brightness=100%
CPU_MaxFreq=100%

[Profile:balanced]
CPU_Governor=ondemand
GPU_PowerSaving=yes
Display_Brightness=80%
CPU_MaxFreq=80%

[Profile:powersave]
CPU_Governor=powersave
GPU_PowerSaving=yes
Display_Brightness=50%
CPU_MaxFreq=50%

[Profile:ultra-powersave]
CPU_Governor=powersave
GPU_PowerSaving=yes
Display_Brightness=30%
CPU_MaxFreq=30%
DisableBluetooth=yes
DisableWiFi=yes
DisableModem=yes
DisableGPS=yes
DisableSensors=yes